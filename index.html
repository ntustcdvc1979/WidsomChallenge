<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9d4f2">
  <title>智慧挑戰所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="player">
    <header>
      <svg class="heart-ribbon" viewBox="0 0 120 60" aria-hidden="true">
        <path d="M5 50 C30 45 45 48 60 40 C40 25 35 5 50 6 C58 7 60 16 60 20 C60 16 62 7 70 6 C85 5 80 25 60 40 C75 48 90 45 115 50"
              fill="none" stroke="#e8503a" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <h1 class="title">智慧<span class="accent">挑戰所</span></h1>
      <div class="slogan">動動腦，解謎題，關關任你挑！</div>
    </header>

    <section class="join paper" id="join">
      <h2>報上名來</h2>
      <p>輸入暱稱，答對時會顯示在大螢幕上</p>
      <input class="input" id="nameInput" maxlength="12" placeholder="你的暱稱" autocomplete="nickname">
      <button class="btn" id="joinBtn">開始挑戰</button>
      <div class="msg bad" id="joinMsg" style="margin-top:10px;color:var(--c-red)"></div>
    </section>

    <section id="game" class="hidden">
      <div class="me">
        <span>挑戰者：<span class="name" id="meName"></span></span>
        <span>已解 <span class="score" id="meScore">0</span> / <span id="meTotal"></span></span>
      </div>
      <div class="sync-note" id="syncNote"></div>
      <div id="overview">
        <div class="tiles" id="tiles"></div>
        <div class="foot-note">點選任一題作答，順序不限</div>
      </div>
      <div id="detail" class="hidden">
        <button class="btn ghost back" id="backBtn">← 返回題目列表</button>
        <div id="detailBody"></div>
      </div>
    </section>
  </div>

  <div class="zoom hidden" id="zoom"><img alt=""></div>
  <div class="celebrate hidden" id="celebrate">
    <div>
      <div class="big">全部破關！</div>
      <p>恭喜你通過智慧挑戰所<br>請出示此畫面給關主蓋章</p>
      <button class="btn" onclick="this.closest('.celebrate').classList.add('hidden')">好的</button>
    </div>
  </div>

  <script type="module" src="js/player.js"></script>
</body>
</html>
